<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>VIP Store | متجر VIP</title>
  <meta name="description" content="متجر VIP — أحدث التصاميم الحصرية بسعر موحد 500 جنيه" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg: #050508;
      --card: #0f0f18;
      --border: rgba(255,255,255,0.06);
      --gold: #f5c518;
      --gold-dim: rgba(245,197,24,0.2);
      --gold-glow: rgba(245,197,24,0.45);
      --text: #eeeef2;
      --muted: #777790;
      --cyan: #00e5ff;
      --wa: #25D366;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Stars Background ─── */
    #stars-canvas {
      position: fixed; top:0; left:0; width:100%; height:100%;
      pointer-events: none; z-index: 0;
    }

    .content { position: relative; z-index: 1; }

    /* ─── Header ─── */
    .header {
      text-align: center;
      padding: 28px 16px 12px;
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 0.3em;
      color: var(--gold);
      text-shadow: 0 0 30px var(--gold-glow), 0 0 80px rgba(245,197,24,0.15);
    }

    .header p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ─── Tabs ─── */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px 12px 16px;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(5,5,8,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .tab-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Cairo', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold);
      text-shadow: 0 0 12px var(--gold-glow);
    }

    .tab-btn:not(.active):hover {
      border-color: rgba(255,255,255,0.15);
      color: var(--text);
    }

    /* ─── Product Grid ─── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 10px 32px;
      max-width: 500px;
      margin: 0 auto;
    }

    @media (min-width: 540px) {
      .grid { max-width: 600px; gap: 12px; padding: 0 14px 40px; }
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(3, 1fr); max-width: 800px; }
    }
    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(4, 1fr); max-width: 1050px; }
    }

    /* ─── Product Card ─── */
    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.25s, border-color 0.3s, box-shadow 0.3s;
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .card:hover, .card:active {
      transform: translateY(-3px);
      border-color: var(--gold-dim);
      box-shadow: 0 6px 24px rgba(245,197,24,0.07);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      background: #0a0a14;
    }

    .card-info {
      padding: 8px 10px 10px;
      text-align: center;
    }

    .model-num {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 2px;
    }

    .price {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .order-cta {
      font-size: 0.65rem;
      color: var(--wa);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* ─── Footer ─── */
    .footer {
      text-align: center;
      padding: 20px 16px 24px;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--muted);
    }

    .footer span { color: var(--gold); }

    /* ─── No-image fallback ─── */
    .card img.error {
      background: linear-gradient(135deg, #111120, #0a0a14);
      position: relative;
    }
  </style>
</head>
<body>

  <!-- Stars Canvas -->
  <canvas id="stars-canvas"></canvas>

  <div class="content">
    <!-- Header -->
    <header class="header">
      <h1>VIP</h1>
      <p>متجر الأزياء الحصرية | Exclusive Fashion Store</p>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="all">الكل | All</button>
      <button class="tab-btn" data-tab="boys">ولاد | Boys</button>
      <button class="tab-btn" data-tab="girls">بنات | Girls</button>
    </div>

    <!-- Product Grid -->
    <div class="grid" id="product-grid"></div>

    <!-- Footer -->
    <footer class="footer">
      © 2026 <span>VIP Brand</span> — جميع الحقوق محفوظة | All rights reserved
    </footer>
  </div>

  <script>
    /* ═══════════════════════════════════════════
       Stars Background
       ═══════════════════════════════════════════ */
    (function initStars() {
      const c = document.getElementById('stars-canvas');
      const ctx = c.getContext('2d');
      let stars = [];

      function resize() {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
      }

      function generate() {
        stars = [];
        const count = Math.min(1800, Math.floor((c.width * c.height) / 700));
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * c.width,
            y: Math.random() * c.height,
            r: Math.random() * 1.1 + 0.15,
            base: Math.random() * 0.55 + 0.15,
            speed: Math.random() * 0.012 + 0.002,
            phase: Math.random() * 6.28,
          });
        }
      }

      let t = 0;
      function draw() {
        ctx.clearRect(0, 0, c.width, c.height);
        t++;
        for (const s of stars) {
          const o = s.base + Math.sin(t * s.speed + s.phase) * 0.2;
          if (o <= 0) continue;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, 6.28);
          ctx.fillStyle = `rgba(255,255,255,${Math.min(1, Math.max(0, o))})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      resize(); generate(); draw();
      window.addEventListener('resize', () => { resize(); generate(); });
    })();

    /* ═══════════════════════════════════════════
       Products — 100 items from images/1..100
       ═══════════════════════════════════════════ */
    const WA_NUMBER = '201006527185';
    const grid = document.getElementById('product-grid');
    const tabBtns = document.querySelectorAll('.tab-btn');
    let currentTab = 'all';

    /* Arabic numeral converter */
    const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

    /* Build card element (reusable) */
    function createCard(num) {
      const cat = num <= 50 ? 'boys' : 'girls';
      const catAr = num <= 50 ? 'ولاد' : 'بنات';
      const msg = encodeURIComponent(
        `مرحباً، أريد طلب الموديل رقم ${toAr(num)} (${catAr})\nHello, I want to order Model #${num} — 500 EGP`
      );
      const href = `https://wa.me/${WA_NUMBER}?text=${msg}`;

      const a = document.createElement('a');
      a.className = 'card';
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.dataset.cat = cat;
      a.innerHTML = `
        <img src="images/${num}.jpg"
             alt="Model ${num}"
             loading="lazy"
             onerror="this.classList.add('error'); this.alt='${num}'" />
        <div class="card-info">
          <div class="model-num">موديل ${toAr(num)} | Model #${num}</div>
          <div class="price">500 EGP</div>
          <div class="order-cta">اضغط للطلب | Click to Order</div>
        </div>
      `;
      return a;
    }

    /* Render all 100 cards once */
    const allCards = [];
    for (let i = 1; i <= 100; i++) {
      const card = createCard(i);
      allCards.push(card);
      grid.appendChild(card);
    }

    /* Tab filtering */
    function filterTab(tab) {
      currentTab = tab;
      tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      allCards.forEach(card => {
        if (tab === 'all') {
          card.style.display = '';
        } else {
          card.style.display = card.dataset.cat === tab ? '' : 'none';
        }
      });
    }

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => filterTab(btn.dataset.tab));
    });
  </script>
</body>
</html>
