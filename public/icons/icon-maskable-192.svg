<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0020"/>
      <stop offset="50%" stop-color="#050010"/>
      <stop offset="100%" stop-color="#0c0020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bf40bf"/>
      <stop offset="50%" stop-color="#7b2fff"/>
      <stop offset="100%" stop-color="#bf40bf"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0c0e0"/>
      <stop offset="70%" stop-color="#bf40bf"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect width="192" height="192" fill="url(#bg)"/>
  <!-- Content in safe zone (centered 80% = ~154px area) -->
  <text x="96" y="88" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-weight="900" font-size="52" fill="url(#text)" letter-spacing="4">VIP</text>
  <text x="96" y="118" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="600" font-size="16" fill="#bf40bf" letter-spacing="3" opacity="0.9">BRAND</text>
</svg>
